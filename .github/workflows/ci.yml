name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: drexel_schedule_generator
          POSTGRES_USER: drexel
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drexel -d drexel_schedule_generator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://drexel:local-development-only@127.0.0.1:5432/drexel_schedule_generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Check migration metadata
        run: python -m alembic -c backend/alembic.ini check
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Check installed dependencies
        run: python -m pip check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm test --prefix frontend -- --run
      - name: Run ESLint
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -f backend/Dockerfile -t drexel-schedule-generator-api:ci backend
