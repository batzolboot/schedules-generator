name: drexel-schedule-generator

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: drexel_schedule_generator
      POSTGRES_USER: drexel
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drexel -d drexel_schedule_generator"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
